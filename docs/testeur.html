<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.clement.olympiad">
<title>Tester SPORTIMATCH</title>
<link rel="icon" href="favicon-32.png">
<style>
  :root {
    --accent: #ebb517;
    --texte: #11161f;
    --texte-attenue: #646972;
    --fond: #f2f5fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --texte: #f3f2ed;
      --texte-attenue: #a7acb6;
      --fond: #0b0f18;
    }
  }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 56px 20px 80px;
    text-align: center;
  }
  img { width: auto; height: 72px; }
  p { color: var(--texte-attenue); margin: 20px 0 1rem; }
  .bouton {
    display: inline-block;
    margin-top: 12px;
    padding: 12px 24px;
    border-radius: 10px;
    background: var(--accent);
    color: #11161f;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <img src="sportimatch-logo.svg" alt="SPORTIMATCH">
  <p>Redirection vers Google Play…<br>Redirecting to Google Play…</p>
  <a class="bouton" href="https://play.google.com/store/apps/details?id=com.clement.olympiad">Google Play</a>
</main>
</body>
</html>
