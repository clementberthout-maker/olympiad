<!doctype html>
<!-- Source de la bannière. Ouvrir avec ?lang=en pour la version anglaise. Rendu : 1024 × 500. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Bebas;src:url(../../../docs/polices/BebasNeue_400Regular.ttf)}
@font-face{font-family:Work;font-weight:500;src:url(../../../docs/polices/WorkSans_500Medium.ttf)}
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden;background:#0b0f18}
.grille{position:absolute;inset:0;background-image:radial-gradient(circle,#2a303c 0 3px,transparent 3.6px);background-size:16px 16px;background-position:8px 10px;
 -webkit-mask-image:radial-gradient(ellipse 72% 90% at 50% 45%,#000 30%,transparent 100%);opacity:.75}
.halo{position:absolute;inset:0;background:radial-gradient(ellipse 46% 52% at 50% 36%,rgba(235,181,23,.16),transparent 100%)}
.bloc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:470px;height:auto;display:block;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.65)}
h1{font:400 44px/1 Bebas;letter-spacing:1.2px;margin-top:26px;color:#fff;white-space:nowrap}
h1 span{color:#ebb517}
p{font:500 19px/1 Work;color:#aab4c4;margin-top:13px;letter-spacing:.2px}
</style></head><body>
<div class="grille"></div><div class="halo"></div>
<div class="bloc"><img src="../01-logos/logo/logo-sportimatch.png" alt="SPORTIMATCH">
<h1 id="t"></h1><p id="s"></p></div>
<script>
const en=new URLSearchParams(location.search).get('lang')==='en';
t.innerHTML=en?'Run your tournament. <span>Everyone follows live.</span>':'Organise ton tournoi. <span>Tout le monde suit en direct.</span>';
s.textContent=en?'Football · Rugby · Handball · Basketball · Tennis':'Football · Rugby · Handball · Basket · Tennis';
</script></body></html>
